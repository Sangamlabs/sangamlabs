<!--
  ========================================================================
  J.A.R.V.I.S // OS CORE - UNIFIED CYBERPUNK TERMINAL & HOLOGRAPHIC EARTH
  100% GitHub README & Camo Proxy Compatible - SVG 1.1 Compliant
  ========================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- RADIAL GLOW GRADIENTS -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#ff2b55" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radarGrad" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ff0033" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0" />
    </radialGradient>

    <!-- LINEAR GRADIENTS -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050203" />
      <stop offset="50%" stop-color="#070308" />
      <stop offset="100%" stop-color="#050203" />
    </linearGradient>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0307" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#030104" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="loadingBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033" />
      <stop offset="70%" stop-color="#ff2b55" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- PATTERNS -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff0033" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>

    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ff0033" fill-opacity="0.12" />
    </pattern>

    <!-- CLIPPINGS -->
    <clipPath id="loadingBarClip">
      <rect x="72" y="422" width="576" height="18" rx="3" />
    </clipPath>

    <clipPath id="earthGlobeClip">
      <circle cx="930" cy="350" r="148" />
    </clipPath>
  </defs>

  <!-- BACKGROUND CANVAS -->
  <rect width="1200" height="700" fill="url(#bgGradient)" />
  <rect width="1200" height="700" fill="url(#gridPattern)" />
  <rect width="1200" height="700" fill="url(#dotGrid)" opacity="0.4" />

  <!-- SUBTLE FLOATING PARTICLES -->
  
  <g opacity="0.15" fill="#00ff66" font-size="9" font-family="monospace, sans-serif">
    <text x="60" y="80">01010100 01000101 01010010 01001101</text>
    <text x="200" y="670">11001010 00110101 11010011 01010101</text>
    <text x="920" y="660">JARVIS_OS // KERNEL_OK</text>
  </g>
  

  <!-- SCANLINE ANIMATION -->
  
  <rect x="0" y="0" width="1200" height="3" fill="#ff0033" opacity="0.15">
    <animateTransform attributeName="transform" type="translate" from="0 -10" to="0 710" dur="5.0s" repeatCount="indefinite" />
  </rect>
  

  <!-- ========================================================= -->
  <!-- UNIFIED LARGE J.A.R.V.I.S. TERMINAL WINDOW (75% SVG AREA)   -->
  <!-- ========================================================= -->
  <g id="JarvisTerminal" font-family="monospace, sans-serif">
    <!-- Outer Main Terminal Box -->
    <rect x="40" y="40" width="1120" height="620" rx="10" fill="url(#glassFill)" stroke="#ff0033" stroke-width="1.5" stroke-opacity="0.8" />
    
    <!-- Outer Glow Frame Accent Corner Brackets -->
    <path d="M 40 80 L 40 50 Q 40 40 50 40 L 90 40" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M 1110 40 L 1150 40 Q 1160 40 1160 50 L 1160 80" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M 1160 620 L 1160 650 Q 1160 660 1150 660 L 1110 660" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M 90 660 L 50 660 Q 40 660 40 650 L 40 620" fill="none" stroke="#ffffff" stroke-width="2" />

    <!-- Terminal Top Control Bar -->
    <path d="M 40 40 L 1160 40 L 1160 76 L 40 76 Z" fill="#ff0033" fill-opacity="0.1" />
    <line x1="40" y1="76" x2="1160" y2="76" stroke="#ff0033" stroke-width="1" opacity="0.6" />

    <!-- Window Controls & Status Indicators -->
    <circle cx="65" cy="58" r="4" fill="#ff4444" />
    <circle cx="80" cy="58" r="4" fill="#ffbb33" />
    <circle cx="95" cy="58" r="4" fill="#00ff66" />

    <!-- Terminal Title -->
    <text x="120" y="62" fill="#ffffff" font-size="12" font-weight="bold" letter-spacing="2">J.A.R.V.I.S // OS CORE</text>
    <text x="320" y="62" fill="#ff6688" font-size="10" opacity="0.8">[ v4.0.8 ARCHITECTURE ]</text>

    <!-- Top Right Status Pill -->
    <rect x="940" y="48" width="200" height="20" rx="4" fill="#000000" fill-opacity="0.6" stroke="#ff0033" stroke-width="0.8" />
    <circle cx="955" cy="58" r="3" fill="#00ff66">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="968" y="62" fill="#00ff66" font-size="10" font-weight="bold">SYSTEM READY // 100%</text>

    <!-- Vertically Separating Divider Line between Left Console & Right Earth Module -->
    <line x1="720" y1="76" x2="720" y2="660" stroke="#ff0033" stroke-width="1" stroke-dasharray="4 4" opacity="0.35" />

    <!-- ========================================================= -->
    <!-- LEFT CONSOLE: BOOT SEQUENCE & KERNEL CALIBRATION           -->
    <!-- ========================================================= -->
    <g id="ConsoleLog" transform="translate(70, 100)">
      <!-- Console Section Header -->
      <text x="0" y="15" fill="#ff6688" font-size="11" font-weight="bold" letter-spacing="1.5">// SYSTEM INITIALIZATION LOG</text>
      <line x1="0" y1="24" x2="610" y2="24" stroke="#ff0033" stroke-width="0.8" opacity="0.4" />

      <!-- SEQUENTIAL BOOT ANIMATION LINES -->
      <!-- Line 1 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.2s" fill="freeze" />
        <text x="0" y="55" fill="#00ff66" font-size="13">&gt; Initializing Neural Engine...</text>
        <text x="380" y="55" fill="#ff6688" font-size="12">[OK]</text>
      </g>

      <!-- Line 2 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.2s" fill="freeze" />
        <text x="0" y="85" fill="#00ff66" font-size="13">&gt; Loading AI Modules...</text>
        <text x="380" y="85" fill="#ff6688" font-size="12">[DONE]</text>
      </g>

      <!-- Line 3 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="1.5s" dur="0.2s" fill="freeze" />
        <text x="0" y="115" fill="#00ff66" font-size="13">&gt; Connecting GitHub API...</text>
        <text x="380" y="115" fill="#ff6688" font-size="12">[CONNECTED]</text>
      </g>

      <!-- Line 4 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="2.1s" dur="0.2s" fill="freeze" />
        <text x="0" y="145" fill="#00ff66" font-size="13">&gt; Loading Developer Profile...</text>
        <text x="380" y="145" fill="#ff6688" font-size="12">[LOADED]</text>
      </g>

      <!-- Line 5 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.2s" fill="freeze" />
        <text x="0" y="180" fill="#ffffff" font-size="15" font-weight="bold">&gt; Welcome, ItachiPlub</text>
      </g>

      <!-- Line 6 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" begin="3.3s" dur="0.2s" fill="freeze" />
        <text x="0" y="215" fill="#ff0033" font-size="14" font-weight="bold">&gt; System Ready</text>
        <text x="180" y="215" fill="#00ff66" font-size="12">[100% OPERATIONAL]</text>
      </g>

      <!-- Blinking Cursor -->
      <g transform="translate(0, 240)">
        <text x="0" y="12" fill="#ff6688" font-size="13">&gt;</text>
        <rect x="18" y="0" width="9" height="15" fill="#ff0033">
          <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite" />
        </rect>
      </g>

      <!-- ========================================================= -->
      <!-- PREMIUM LOADING BAR                                        -->
      <!-- ========================================================= -->
      <g id="LoadingBarModule" transform="translate(0, 280)">
        <text x="0" y="12" fill="#ff6688" font-size="11" font-weight="bold" letter-spacing="1">SYSTEM KERNEL CALIBRATION</text>
        <text x="540" y="12" fill="#ffffff" font-size="12" font-weight="bold">100%</text>

        <!-- Bar Container Track -->
        <rect x="0" y="22" width="580" height="22" rx="4" fill="#000000" stroke="#ff0033" stroke-width="1" />

        <!-- Clipped Animated Fill & Moving Shine -->
        <g clip-path="url(#loadingBarClip)" transform="translate(-72, -400)">
          <rect x="72" y="422" width="576" height="18" fill="url(#loadingBarGrad)">
            <animate attributeName="width" from="0" to="576" begin="0.3s" dur="3.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
          </rect>
          <polygon points="0,0 45,0 20,22 -25,22" fill="#ffffff" opacity="0.8">
            <animateTransform attributeName="transform" type="translate" from="20 422" to="680 422" dur="2.2s" repeatCount="indefinite" />
          </polygon>
        </g>
      </g>

      <!-- DEVELOPER PROFILE FOOTER TELEMETRY STRIP -->
      <g id="ProfileTelemetry" transform="translate(0, 365)">
        <rect x="0" y="0" width="580" height="130" rx="6" fill="#000000" fill-opacity="0.6" stroke="#ff0033" stroke-width="0.8" stroke-opacity="0.3" />
        <text x="16" y="24" fill="#ff6688" font-size="11" font-weight="bold" letter-spacing="1.5">// USER IDENTITY &amp; CORE STACK</text>
        <line x1="16" y1="32" x2="564" y2="32" stroke="#ff0033" stroke-width="0.5" opacity="0.3" />

        <text x="16" y="56" fill="#ffffff" font-size="11">IDENTITY:</text>
        <text x="95" y="56" fill="#00ff66" font-size="11">ItachiPlub // SENIOR FULL-STACK ARCHITECT</text>

        <text x="16" y="78" fill="#ffffff" font-size="11">CORE TECH:</text>
        <text x="95" y="78" fill="#ff6688" font-size="11">TypeScript • React • Node.js • Rust • Python</text>

        <text x="16" y="100" fill="#ffffff" font-size="11">LOCATION:</text>
        <text x="95" y="100" fill="#00ff66" font-size="11">TOKYO, JP [35.6762° N, 139.6503° E]</text>

        <text x="440" y="100" fill="#ff0033" font-size="11" font-weight="bold">STATUS: ONLINE</text>
      </g>

    </g> <!-- End Left Console -->

    <!-- ========================================================= -->
    <!-- RIGHT SIDE: HOLOGRAPHIC EARTH MODULE                       -->
    <!-- ========================================================= -->
    <g id="HolographicEarthModule">
      <!-- Ambient Glow behind Earth -->
      <circle cx="930" cy="350" r="220" fill="url(#ambientGlow)" />

      <!-- Outer Atmosphere Ring -->
      <circle cx="930" cy="350" r="152" fill="none" stroke="#ff0033" stroke-width="1.8" stroke-opacity="0.8" />
      <circle cx="930" cy="350" r="150" fill="#ff0033" fill-opacity="0.05" />

      <!-- Orbit Ring 1 (Tilted Orbit) -->
      <g transform="rotate(-20 930 350)">
        <ellipse cx="930" cy="350" rx="190" ry="55" fill="none" stroke="#ff0033" stroke-width="1" stroke-dasharray="8 6" opacity="0.7">
          <animateTransform attributeName="transform" type="rotate" from="0 930 350" to="360 930 350" dur="20.0s" repeatCount="indefinite" />
        </ellipse>
        <circle cx="1120" cy="350" r="3.5" fill="#ffffff" />
      </g>

      <!-- Orbit Ring 2 (Counter Orbit) -->
      <g transform="rotate(35 930 350)">
        <ellipse cx="930" cy="350" rx="175" ry="50" fill="none" stroke="#ff2b55" stroke-width="1" opacity="0.6">
          <animateTransform attributeName="transform" type="rotate" from="360 930 350" to="0 930 350" dur="30.0s" repeatCount="indefinite" />
        </ellipse>
        <circle cx="755" cy="350" r="3" fill="#00ff66" />
      </g>

      <!-- Orbit Ring 3 (Outer Scanner Ring) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 930 350" to="360 930 350" dur="15.0s" repeatCount="indefinite" />
        <circle cx="930" cy="350" r="162" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="60 200 40 100" />
        <circle cx="930" cy="188" r="4" fill="#ff2b55" />
      </g>

      <!-- Radar Sweep Cone -->
      <g transform="rotate(0 930 350)">
        <animateTransform attributeName="transform" type="rotate" from="0 930 350" to="360 930 350" dur="15.0s" repeatCount="indefinite" />
        <path d="M 930 350 L 1080 350 A 150 150 0 0 0 930 200 Z" fill="url(#radarGrad)" opacity="0.35" />
      </g>

      <!-- Globe Latitude / Longitude Grid -->
      <line x1="780" y1="350" x2="1080" y2="350" stroke="#ff0033" stroke-width="1" opacity="0.4" />
      <line x1="930" y1="200" x2="930" y2="500" stroke="#ff0033" stroke-width="1" opacity="0.4" />
      <ellipse cx="930" cy="350" rx="150" ry="40" fill="none" stroke="#ff0033" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.4" />
      <ellipse cx="930" cy="350" rx="150" ry="90" fill="none" stroke="#ff0033" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.4" />
      <ellipse cx="930" cy="350" rx="60" ry="150" fill="none" stroke="#ff0033" stroke-width="0.8" opacity="0.4" />

      <!-- Rotating Globe Landmasses -->
      <g clip-path="url(#earthGlobeClip)">
        <g stroke="#ff0033" stroke-width="1.2" fill="#ff0033" fill-opacity="0.28">
          <animateTransform attributeName="transform" type="translate" from="-140 0" to="140 0" dur="30.0s" repeatCount="indefinite" />
          <!-- Primary Landmass Set -->
          <polygon points="820,260 850,240 880,250 890,280 870,310 830,320 800,300 810,270" />
          <polygon points="860,340 880,360 870,410 850,430 840,380" />
          <polygon points="950,240 980,230 1000,250 970,280 940,260" />
          <polygon points="950,290 990,300 1010,350 980,410 940,370 940,310" />
          <polygon points="1020,220 1070,230 1100,270 1060,300 1010,260" />
          <polygon points="1070,350 1100,360 1090,390 1060,380" />

          <!-- Repeating Set for Seamless Scroll Loop -->
          <polygon points="680,260 710,240 740,250 750,280 730,310 690,320 660,300 670,270" />
          <polygon points="720,340 740,360 730,410 710,430 700,380" />
          <polygon points="810,240 840,230 860,250 830,280 800,260" />
          <polygon points="810,290 850,300 870,350 840,410 800,370 800,310" opacity="0.9" />
        </g>
      </g>

      <!-- Core Glowing Node -->
      <circle cx="930" cy="350" r="10" fill="url(#coreGlow)" opacity="0.9" />

      <!-- Earth Top Badge -->
      <rect x="850" y="170" width="160" height="22" rx="4" fill="#000000" fill-opacity="0.85" stroke="#ff0033" stroke-width="1" />
      <text x="862" y="185" fill="#ffffff" font-size="10" font-weight="bold">HOLOGRAPHIC GLOBE</text>

      <!-- Earth Bottom Telemetry Box -->
      <g transform="translate(775, 520)">
        <rect x="0" y="0" width="310" height="34" rx="5" fill="#000000" fill-opacity="0.85" stroke="#ff0033" stroke-width="0.8" />
        <text x="12" y="15" fill="#ff6688" font-size="9">LAT: 35.6762° N  LON: 139.6503° E</text>
        <text x="12" y="27" fill="#00ff66" font-size="9">ORBIT: 408 KM  •  LINK: SYNCED</text>
      </g>
    </g> <!-- End Holographic Earth Module -->

  </g> <!-- End JarvisTerminal -->
</svg>
