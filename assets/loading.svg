<svg width="600" height="70" viewBox="0 0 600 70" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
  </defs>

  <text
    x="300"
    y="18"
    fill="#ff3333"
    text-anchor="middle"
    font-size="15"
    font-family="monospace">
    Initializing AI Neural Core...
  </text>

  <!-- Background -->
  <rect
    x="20"
    y="35"
    width="560"
    height="18"
    rx="9"
    fill="#1a1a1a"
    stroke="#ff0000"
    stroke-width="1"/>

  <!-- Loading Bar -->
  <rect
    x="20"
    y="35"
    width="0"
    height="18"
    rx="9"
    fill="url(#red)">

    <animate
      attributeName="width"
      values="0;560;0"
      dur="3s"
      repeatCount="indefinite"/>

  </rect>

</svg>
